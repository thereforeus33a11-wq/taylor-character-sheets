<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Taylor — Character Sheets</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#1a1d24; --text:#f2f2f2; --muted:#9aa3b2; --accent:#c41e3a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 2rem 1.25rem 1rem; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 .35rem; font-size:1.75rem; letter-spacing:.02em; }
  p { color:var(--muted); margin:.35rem 0; line-height:1.5; }
  a { color:#ff6b81; }
  .grid { max-width:1100px; margin:0 auto; padding:0 1.25rem 3rem; display:grid; gap:1.25rem; }
  figure { margin:0; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid #2a2f3a; }
  figure img { width:100%; display:block; background:#111; }
  figcaption { padding:.85rem 1rem 1rem; }
  figcaption strong { display:block; margin-bottom:.25rem; }
  figcaption span { color:var(--muted); font-size:.9rem; }
  .actions { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1rem; }
  .btn { display:inline-block; padding:.55rem .9rem; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:.9rem; }
  .btn.secondary { background:#2a3140; }
</style>
</head>
<body>
<header>
  <h1>Taylor — Character Sheets</h1>
  <p>Jim's Delivery · recreated from source comic panels · western adult digital comic style</p>
  <p>Natural green eyes · freckles · red headband · black choker · JIM'S crop top · red gloves · blue micro shorts · navel piercing · thigh bandage</p>
  <div class="actions">
    <a class="btn" href="taylor_character_sheets.zip">Download ZIP (all sheets)</a>
    <a class="btn secondary" href="https://github.com/thereforeus33a11-wq/taylor-character-sheets">GitHub repo</a>
  </div>
</header>
<div class="grid">
  <figure>
    <img src="01_character_sheet.jpg" alt="Character design sheet"/>
    <figcaption><strong>Character Design Sheet</strong><span>Front view + portrait + palette + detail callouts (navel piercing, glove, logo, waistband)</span></figcaption>
  </figure>
  <figure>
    <img src="01b_base_front_fullbody.jpg" alt="Base front fullbody"/>
    <figcaption><strong>Base Full-Body Front</strong><span>Clean single-figure reference</span></figcaption>
  </figure>
  <figure>
    <img src="02_turnaround_sheet.jpg" alt="Turnaround"/>
    <figcaption><strong>Turnaround Sheet</strong><span>Front · 3/4 · side profile · back</span></figcaption>
  </figure>
  <figure>
    <img src="03_facial_expressions_sheet.jpg" alt="Expressions"/>
    <figcaption><strong>Facial Expressions</strong><span>Neutral, annoyed, angry, embarrassed, shocked, smirk, tired, happy, determined</span></figcaption>
  </figure>
  <figure>
    <img src="04_poses_sheet.jpg" alt="Poses"/>
    <figcaption><strong>Poses Sheet</strong><span>Confident stand · bike ride · wave · fix chain · delivery walk · rest</span></figcaption>
  </figure>
</div>
</body>
</html>
